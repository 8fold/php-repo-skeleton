# Maintained in 8fold/php-repo-skeleton; do not edit outside of 8fold/php-repo-skeleton
name: Sync PHP Dependabot Configuration

on:
  schedule:
    - cron: '0 0 1 */3 *' # Quarterly sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-php-dependabot:
    name: Sync dependabot.yml to PHP Repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout php-repo-skeleton Repository
        uses: actions/checkout@v7

      - name: Generate Cross-Repo App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Distribute dependabot.yml to PHP Repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          DEPENDABOT_FILE=".github/dependabot.yml"

          if [ ! -f "$DEPENDABOT_FILE" ]; then
            echo "::error::Local $DEPENDABOT_FILE file not found in php-repo-skeleton!"
            exit 1
          fi

          FILE_CONTENT=$(base64 -w 0 "$DEPENDABOT_FILE")

          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | .name')

          for repo in $REPOS; do
            # Check if target repository contains a root composer.json file
            if gh api "repos/$ORG_NAME/$repo/contents/composer.json" > /dev/null 2>&1; then
              echo "Repository '$repo' contains composer.json. Syncing dependabot.yml..."

              EXISTING_SHA=$(gh api "repos/$ORG_NAME/$repo/contents/$DEPENDABOT_FILE" --jq '.sha' 2>/dev/null || true)

              if [ -n "$EXISTING_SHA" ]; then
                PAYLOAD=$(jq -n --arg content "$FILE_CONTENT" --arg sha "$EXISTING_SHA" \
                  '{message: "chore: update dependabot.yml for composer and actions", content: $content, sha: $sha}')
              else
                PAYLOAD=$(jq -n --arg content "$FILE_CONTENT" \
                  '{message: "chore: add dependabot.yml for composer and actions", content: $content}')
              fi

              if gh api -X PUT "repos/$ORG_NAME/$repo/contents/$DEPENDABOT_FILE" --input - <<< "$PAYLOAD" > /dev/null 2>&1; then
                echo "  ✓ Successfully synced dependabot.yml to $repo"
              else
                echo "  ::warning:: Failed to sync dependabot.yml to $repo"
              fi
            else
              echo "Skipping '$repo': No composer.json found at repository root."
            fi
          done
