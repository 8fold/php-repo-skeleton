# Maintained in 8fold/php-repo-skeleton; do not edit outside of 8fold/php-repo-skeleton
name: Sync PHP Version Workflows

on:
  schedule:
    - cron: '0 0 1 */3 *' # Quarterly sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-php-workflows:
    name: Sync PHP Deployment Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout php-repo-skeleton Repository
        uses: actions/checkout@v4

      - name: Generate Cross-Repo App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Composer Semver Library
        run: |
          composer global require composer/semver --quiet

      - name: Distribute Workflows Based on PHP Version Support
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          COMPOSER_VENDOR=$(composer global config vendor-dir --absolute)

          # Mappings format: "local_workflow_file:target_php_version"
          WORKFLOW_MAPPINGS=(
            ".github/workflows/is-deployable-php-080500.yml:8.5.0"
            ".github/workflows/is-deployable-php-080400.yml:8.4.0"
          )

          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | .name')

          for repo in $REPOS; do
            echo "=========================================="
            echo "Checking repository: $repo"
            echo "=========================================="

            # Fetch target repo's composer.json
            COMPOSER_RAW=$(gh api "repos/$ORG_NAME/$repo/contents/composer.json" --jq '.content' 2>/dev/null || true)

            if [ -z "$COMPOSER_RAW" ]; then
              echo "  Skipping: No composer.json found at root."
              continue
            fi

            # Extract PHP constraint from composer.json
            PHP_CONSTRAINT=$(echo "$COMPOSER_RAW" | base64 -d | jq -r '.require.php // empty')

            if [ -z "$PHP_CONSTRAINT" ]; then
              echo "  Skipping: No PHP version requirement specified in composer.json."
              continue
            fi

            echo "  Found PHP constraint in composer.json: '$PHP_CONSTRAINT'"

            for mapping in "${WORKFLOW_MAPPINGS[@]}"; do
              WORKFLOW_FILE="${mapping%%:*}"
              PHP_VER="${mapping#*:}"
              DEST_PATH=".github/workflows/$(basename "$WORKFLOW_FILE")"

              if [ ! -f "$WORKFLOW_FILE" ]; then
                continue
              fi

              # Check if PHP_VER satisfies PHP_CONSTRAINT using Composer's official Semver engine
              IS_SUPPORTED=$(php -r "
                require '$COMPOSER_VENDOR/autoload.php';
                use Composer\Semver\Semver;
                try {
                    echo Semver::satisfies('$PHP_VER', '$PHP_CONSTRAINT') ? 'true' : 'false';
                } catch (\Exception \$e) {
                    echo 'false';
                }
              ")

              if [ "$IS_SUPPORTED" = "true" ]; then
                echo "  ✓ PHP $PHP_VER is supported by '$PHP_CONSTRAINT'. Syncing $DEST_PATH..."
                FILE_CONTENT=$(base64 -w 0 "$WORKFLOW_FILE")
                EXISTING_SHA=$(gh api "repos/$ORG_NAME/$repo/contents/$DEST_PATH" --jq '.sha' 2>/dev/null || true)

                if [ -n "$EXISTING_SHA" ]; then
                  PAYLOAD=$(jq -n --arg content "$FILE_CONTENT" --arg sha "$EXISTING_SHA" \
                    '{message: "ci: update php deployment workflow", content: $content, sha: $sha}')
                else
                  PAYLOAD=$(jq -n --arg content "$FILE_CONTENT" \
                    '{message: "ci: add php deployment workflow", content: $content}')
                fi

                gh api -X PUT "repos/$ORG_NAME/$repo/contents/$DEST_PATH" --input - <<< "$PAYLOAD" > /dev/null 2>&1
              else
                echo "  ✗ PHP $PHP_VER is NOT supported by '$PHP_CONSTRAINT'. Skipping $DEST_PATH."

                # Cleanup: If workflow exists in target repo but is no longer supported by composer.json, remove it
                EXISTING_SHA=$(gh api "repos/$ORG_NAME/$repo/contents/$DEST_PATH" --jq '.sha' 2>/dev/null || true)
                if [ -n "$EXISTING_SHA" ]; then
                  echo "  🗑 Removing unsupported $DEST_PATH from $repo..."
                  PAYLOAD=$(jq -n --arg sha "$EXISTING_SHA" '{message: "ci: remove unsupported php deployment workflow", sha: $sha}')
                  gh api -X DELETE "repos/$ORG_NAME/$repo/contents/$DEST_PATH" --input - <<< "$PAYLOAD" > /dev/null 2>&1 || true
                fi
              fi
            done
          done
