name: Sync Repository Security & Quality Settings

on:
  schedule:
    - cron: '0 0 1 */3 *'    # Quarterly sync
  workflow_dispatch:          # Manual trigger

jobs:
  sync-security:
    name: Enforce Org-Wide Security & Quality Settings
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Security & Quality Settings across Org
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: |
          FAIL_COUNT=0
          FAILED_REPOS=()

          # Fetch repository name and visibility (private vs public)
          REPOS_JSON=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | {name: .name, private: .private}')

          echo "$REPOS_JSON" | jq -c '.' | while read -r repo_info; do
            [ -z "$repo_info" ] && continue

            repo=$(echo "$repo_info" | jq -r '.name')
            is_private=$(echo "$repo_info" | jq -r '.private')

            if [ "$repo" = "$SOURCE_REPO" ]; then
              continue
            fi

            echo ""
            echo "Configuring security settings for: $repo (Private: $is_private)"
            REPO_FAILED=0

            # --- A. Enable Private Vulnerability Reporting (Security Advisories) ---
            if ! gh api "repos/$ORG_NAME/$repo" -X PATCH -F private_vulnerability_reporting_enabled=true > /dev/null 2>&1; then
              echo "::warning::Failed to enable Private Vulnerability Reporting for $repo"
              REPO_FAILED=1
            fi

            # --- B. Enable Dependabot Alerts (Free on Public & Private) ---
            if ! gh api "repos/$ORG_NAME/$repo/vulnerability-alerts" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Alerts for $repo"
              REPO_FAILED=1
            fi

            # --- C. Enable Dependabot Security Updates (Free on Public & Private) ---
            if ! gh api "repos/$ORG_NAME/$repo/automated-security-fixes" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Security Updates for $repo"
              REPO_FAILED=1
            fi

            # --- D. Secret Scanning & Push Protection ---
            # Secret Scanning & Push Protection are free ONLY for Public repos on GitHub Free/Team plans.
            if [ "$is_private" = "false" ]; then
              PAYLOAD=$(jq -n '{
                security_and_analysis: {
                  secret_scanning: { status: "enabled" },
                  secret_scanning_push_protection: { status: "enabled" }
                }
              }')
              if ! gh api "repos/$ORG_NAME/$repo" -X PATCH --input - <<< "$PAYLOAD" > /dev/null 2>&1; then
                echo "::warning::Failed to enable Secret Scanning for public repo $repo"
                REPO_FAILED=1
              fi
            fi

            if [ "$REPO_FAILED" -eq 1 ]; then
              echo "::error::Security configuration failed for $repo"
            fi
          done
