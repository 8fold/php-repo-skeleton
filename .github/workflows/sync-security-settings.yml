name: Sync Repository Security & Quality Settings

on:
  schedule:
    - cron: '0 0 1 */3 *'    # Quarterly sync
  workflow_dispatch:          # Manual trigger

jobs:
  sync-security:
    name: Enforce Org-Wide Security & Quality Settings
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Security & Quality Settings across Org
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: |
          FAIL_COUNT=0
          FAILED_REPOS=()

          # 1. Fetch active, non-archived repositories in the organization
          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | .name')

          for repo in $REPOS; do
            # Skip the source template repo itself if desired
            if [ "$repo" = "$SOURCE_REPO" ]; then
              continue
            fi

            echo ""
            echo "Configuring security settings for: $repo"

            REPO_FAILED=0

            # --- A. Enable Private Vulnerability Reporting (Security Advisories) ---
            if ! gh api "repos/$ORG_NAME/$repo" -X PATCH -F private_vulnerability_reporting_enabled=true > /dev/null 2>&1; then
              echo "::warning::Failed to enable Private Vulnerability Reporting for $repo"
              REPO_FAILED=1
            fi

            # --- B. Enable Dependabot Alerts ---
            if ! gh api "repos/$ORG_NAME/$repo/vulnerability-alerts" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Alerts for $repo"
              REPO_FAILED=1
            fi

            # --- C. Enable Dependabot Automated Security Updates ---
            if ! gh api "repos/$ORG_NAME/$repo/automated-security-fixes" -X PUT > /dev/null 2>&1; then
              echo "::warning::Failed to enable Dependabot Security Updates for $repo"
              REPO_FAILED=1
            fi

            # --- D. Enable Secret Scanning & Push Protection (Public repos / GHAS) ---
            PAYLOAD=$(jq -n '{
              security_and_analysis: {
                secret_scanning: { status: "enabled" },
                secret_scanning_push_protection: { status: "enabled" }
              }
            }')
            gh api "repos/$ORG_NAME/$repo" -X PATCH --input - <<< "$PAYLOAD" > /dev/null 2>&1 || true

            if [ "$REPO_FAILED" -eq 1 ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_REPOS+=("$repo")
            fi
          done

          echo ""
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Security configuration failed for $FAIL_COUNT repository/repositories: ${FAILED_REPOS[*]}"
            exit 1
          else
            echo "Successfully enforced security settings across all target repositories."
          fi
